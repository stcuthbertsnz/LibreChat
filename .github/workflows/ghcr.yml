name: GHCR Image

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'client/**'
      - 'config/**'
      - 'skill/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile.multi'
      - '.dockerignore'
      - '.github/workflows/ghcr.yml'
  pull_request:
    paths:
      - 'Dockerfile.multi'
      - '.github/workflows/ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and publish API image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve image name and build metadata
        run: |
          printf 'IMAGE=ghcr.io/%s/librechat-api\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          printf 'BUILD_COMMIT=%s\n' "$GITHUB_SHA" >> "$GITHUB_ENV"
          printf 'BUILD_DATE=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (pushed on main, build-only on pull requests)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.multi
          target: api-build
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_COMMIT=${{ env.BUILD_COMMIT }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
